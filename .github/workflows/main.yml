name: CI

on:
  push:
    branches:
      - main
      - dev
      - pilot
  pull_request:
    branches:
      - main
      - dev
      - pilot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Graph Harness SHIP consumer contract
        run: python3 scripts/verify_ship_graph.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency Audit (High+)
        run: npm audit --audit-level=high

  browser-gate:
    name: Browser-driven QA (isolated Chromium)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build standalone QA server
        run: npm run build

      - name: Execute UI, security and responsive assertions
        run: npm run test:e2e

      - name: Preserve screenshots, traces, JSON and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argos-browser-qa-${{ github.run_id }}
          path: |
            artifacts/qa/
            docs/ship/evidence/latest-browser.json
          if-no-files-found: warn
          retention-days: 14
